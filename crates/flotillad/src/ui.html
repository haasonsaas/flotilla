<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flotilla</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #6b7280; --line: #e5e7eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --acc: #2563eb; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e5e7eb; --bg: #0f1115; --muted: #9ca3af; --line: #262a33; --card: #161920; } }
  body { margin: 0; padding: 20px 24px; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 8px; }
  .sub { color: var(--muted); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; } tr:last-child td { border-bottom: 0; }
  td.cmd { white-space: normal; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; max-width: 46ch; overflow-wrap: anywhere; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .on { background: var(--ok); } .off { background: var(--muted); }
  .bar { display: inline-block; width: 90px; height: 8px; background: var(--line); border-radius: 4px; vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--acc); }
  .bar.hot i { background: var(--bad); } .bar.warm i { background: var(--warn); }
  .st { font-weight: 600; } .st.running { color: var(--warn); } .st.succeeded, .st.done { color: var(--ok); } .st.failed, .st.orphaned { color: var(--bad); } .st.cancelled, .st.pending { color: var(--muted); }
  button { font: inherit; font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; cursor: pointer; } button:hover { border-color: var(--acc); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); margin-right: 4px; }
  #live { float: right; font-size: 12px; color: var(--muted); }
  .st.lost { color: var(--bad); } .st.claimed { color: var(--warn); } .st.queued { color: var(--muted); }
  tr.row { cursor: pointer; } tr.row:hover td { background: color-mix(in srgb, var(--acc) 6%, transparent); }
  #drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(560px, 100vw); background: var(--card); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.15); padding: 18px 20px; overflow: auto; box-sizing: border-box; }
  #drawer[hidden] { display: none; }
  #drawer h3 { margin: 0 0 10px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  #drawer h4 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  #drawer dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: 13px; } #drawer dt { color: var(--muted); } #drawer dd { margin: 0; }
  #drawer pre { font: 12px/1.4 ui-monospace, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 40vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  #drawer .rec { font: 12px ui-monospace, Menlo, monospace; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
  #drawer .close { float: right; }
  .empty { color: var(--muted); padding: 10px; }
  .filters { display: flex; gap: 8px; margin: 0 0 8px; flex-wrap: wrap; }
  .filters select, .filters input { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  .filters input { flex: 1; min-width: 200px; }
</style>
</head>
<body>
<span id="live">connecting…</span>
<h1>flotilla</h1>
<div class="sub" id="me"></div>

<h2>Nodes</h2>
<table><thead><tr><th>node</th><th>version</th><th>load / cpu</th><th>mem free</th><th>disk free</th><th>battery</th><th>jobs</th><th>labels</th><th>facts</th></tr></thead><tbody id="nodes"></tbody></table>

<h2>Agents &amp; jobs (last 24h)</h2>
<div class="filters">
  <select id="fNode"><option value="">all nodes</option></select>
  <select id="fState"><option value="">all states</option><option>queued</option><option>claimed</option><option>running</option><option>succeeded</option><option>failed</option><option>cancelled</option><option>lost</option></select>
  <select id="fKind"><option value="">all kinds</option></select>
  <input id="fText" type="search" placeholder="search command, id, batch, session">
</div>
<table><thead><tr><th>id</th><th>kind</th><th>state</th><th>node</th><th>session / batch</th><th>submitted</th><th>elapsed</th><th>exit</th><th>command</th><th></th></tr></thead><tbody id="jobs"></tbody></table>

<aside id="drawer" hidden></aside>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = (ms) => { const s = Math.max(0, Math.floor((Date.now() - ms) / 1000)); return s < 90 ? s + "s" : s < 5400 ? Math.floor(s/60) + "m" : s < 172800 ? Math.floor(s/3600) + "h" : Math.floor(s/86400) + "d"; };
const dur = (a, b) => { const s = Math.max(0, Math.floor((b - a) / 1000)); return s < 90 ? s + "s" : Math.floor(s/60) + "m" + (s%60) + "s"; };
async function j(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(url + " -> " + r.status); return r.json(); }

let names = {};
async function render() {
  const [st, jobs, claims, results] = await Promise.all([
    j("/v1/status"), j("/v1/records?prefix=job/"), j("/v1/records?prefix=claim/"), j("/v1/records?prefix=result/")]);
  names = {}; for (const n of st.nodes) names[n.facts.node_id] = n.facts.name;
  $("me").textContent = "viewing from " + (names[st.me] || st.me) + " · " + st.nodes.filter(n => n.online).length + " of " + st.nodes.length + " nodes online";
  $("nodes").innerHTML = st.nodes.map(n => {
    const f = n.facts, ratio = f.cpus ? f.load_1m / f.cpus : 0, pct = Math.min(100, Math.round(ratio * 100));
    const cls = ratio > 1 ? "hot" : ratio > 0.5 ? "warm" : "";
    const batt = f.battery_pct != null ? f.battery_pct + "%" + (f.on_ac ? " ⚡" : "") : (f.on_ac ? "ac" : "–");
    const labels = Object.entries(f.labels).filter(([k]) => !["os","arch","node"].includes(k)).map(([k,v]) => `<span class="tag">${esc(k)}=${esc(v)}</span>`).join("");
    return `<tr><td><span class="dot ${n.online ? "on" : "off"}"></span><b>${esc(f.name)}</b>${f.node_id === st.me ? " *" : ""}<div class="sub">${esc(f.os)} · ${esc(f.arch)}</div></td>
      <td>${esc(f.version)}</td><td><span class="bar ${cls}"><i style="width:${pct}%"></i></span>${f.load_1m.toFixed(1)} / ${f.cpus}</td>
      <td>${(f.mem_free_mb/1024).toFixed(1)} GB</td><td>${f.disk_free_gb} GB</td><td>${batt}</td><td>${f.running_jobs.length}</td><td>${labels}</td><td>${ago(f.reported_at_ms)} ago</td></tr>`;
  }).join("") || `<tr><td colspan="9" class="empty">no facts yet</td></tr>`;

  const byJob = (recs, key) => Object.fromEntries(recs.records.map(r => [r.value[key], r.value]));
  const cl = byJob(claims, "job_id"), rs = byJob(results, "job_id");
  const cutoff = Date.now() - 24 * 3600 * 1000;
  const all = jobs.records.map(r => r.value).filter(s => !(rs[s.id] && rs[s.id].finished_at_ms < cutoff)).sort((a, b) => b.submitted_at_ms - a.submitted_at_ms);
  fillSelect($("fNode"), st.nodes.map(n => [n.facts.node_id, n.facts.name]));
  fillSelect($("fKind"), [...new Set(all.map(s => s.kind || "job"))].map(k => [k, k]));
  const fNode = $("fNode").value, fState = $("fState").value, fKind = $("fKind").value, fText = $("fText").value.trim().toLowerCase();
  const rows = all.filter(s => {
    const c = cl[s.id], r = rs[s.id];
    if (fNode && !(c && c.node === fNode) && s.node !== fNode) return false;
    if (fState && stateOf(s, c, r) !== fState) return false;
    if (fKind && (s.kind || "job") !== fKind) return false;
    if (fText && ![s.id, s.cmd.join(" "), s.batch, s.tmux, s.submitted_by].filter(Boolean).some(x => x.toLowerCase().includes(fText))) return false;
    return true;
  });
  $("jobs").innerHTML = rows.map(s => {
    const c = cl[s.id], r = rs[s.id];
    const state = stateOf(s, c, r);
    const node = c ? (names[c.node] || c.node) : "";
    const elapsed = c ? (r ? dur(r.started_at_ms, r.finished_at_ms) : dur(c.claimed_at_ms, Date.now())) : "";
    const exit = r ? (r.exit_code ?? (r.error || "?")) : "";
    const target = s.node ? (names[s.node] || s.node) : Object.entries(s.selector || {}).map(([k,v]) => k + "=" + v).join(",") || (s.pick || "any");
    const btn = (!r && !s.cancelled) ? `<button data-id="${esc(s.id)}">cancel</button>` : "";
    return `<tr class="row" data-job="${esc(s.id)}"><td title="${esc(s.id)}">${esc(s.id.slice(0,8))}</td><td>${esc(s.kind || "job")}</td><td class="st ${state}">${state}</td><td>${esc(node)}<div class="sub">${esc(target)}</div></td>
      <td>${esc(s.tmux || "")}${s.batch ? `<div class="sub">batch ${esc(s.batch)}</div>` : ""}${s.retries ? `<div class="sub">retry ${s.retry}/${s.retries}</div>` : ""}</td><td>${ago(s.submitted_at_ms)} ago<div class="sub">${esc(s.submitted_by)}</div></td><td>${elapsed}</td><td>${esc(exit)}</td><td class="cmd">${esc(s.cmd.join(" "))}</td><td>${btn}</td></tr>`;
  }).join("") || `<tr><td colspan="10" class="empty">no jobs</td></tr>`;
  for (const b of document.querySelectorAll("button[data-id]")) b.onclick = (e) => { e.stopPropagation(); cancel(b.dataset.id); };
  for (const tr of document.querySelectorAll("tr.row")) tr.onclick = () => openDrawer(tr.dataset.job);
  if (openId) refreshDrawer();
}
function fillSelect(sel, pairs) {
  const cur = sel.value;
  const first = sel.options[0].outerHTML;
  sel.innerHTML = first + pairs.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
  sel.value = cur;
}
for (const id of ["fNode", "fState", "fKind"]) $(id).addEventListener("change", schedule);
$("fText").addEventListener("input", schedule);
function stateOf(s, c, r) {
  if (r) return (r.error === "cancelled" || (s.cancelled && r.exit_code == null)) ? "cancelled" : r.exit_code === 0 ? "succeeded" : "failed";
  if (s.cancelled) return "cancelled";
  if (!c) return "queued";
  if (c.lease_until_ms && Date.now() > c.lease_until_ms) return "lost";
  return c.started_at_ms ? "running" : "claimed";
}
const hms = (ms) => ms ? new Date(ms).toLocaleTimeString([], {hour12: false}) + "." + String(ms % 1000).padStart(3, "0") : "";
let openId = null;
async function openDrawer(id) { openId = id; await refreshDrawer(); }
function closeDrawer() { openId = null; $("drawer").hidden = true; }
async function refreshDrawer() {
  const id = openId; if (!id) return;
  const raw = await j("/v1/records?prefix=job/" + id).catch(() => ({records: []}));
  const rawC = await j("/v1/records?prefix=claim/" + id).catch(() => ({records: []}));
  const rawR = await j("/v1/records?prefix=result/" + id).catch(() => ({records: []}));
  const jr = raw.records[0], cr = rawC.records[0], rr = rawR.records[0];
  if (!jr) { $("drawer").innerHTML = `<button class="close" onclick="closeDrawer()">close</button><h3>${esc(id)}</h3><p class="sub">no such job</p>`; $("drawer").hidden = false; return; }
  const s = jr.value, c = cr && cr.value, r = rr && rr.value, state = stateOf(s, c, r);
  let out = "";
  try { const resp = await fetch("/v1/jobs/" + id + "/log?tail=16384"); out = resp.ok ? await resp.text() : (r ? r.output_tail : ""); } catch { out = r ? r.output_tail : ""; }
  const timeline = [["job.created", s.submitted_at_ms, "by " + s.submitted_by]];
  if (c) timeline.push(["job.claimed", c.claimed_at_ms, (names[c.node] || c.node) + " · attempt " + c.attempt]);
  if (c && c.started_at_ms) timeline.push(["job.started", c.started_at_ms, ""]);
  if (s.cancelled) timeline.push(["job.cancelled", null, "requested"]);
  if (r) timeline.push(["job.exited", r.finished_at_ms, "exit " + (r.exit_code ?? "none") + (r.error ? " (" + r.error + ")" : "")]);
  const recs = [jr, cr, rr].filter(Boolean).map(x => `<span>${esc(x.key.split("/")[0])}</span><span>${esc(x.author)} @ ${esc(String(x.hlc))}${x.deleted ? " (tombstone)" : ""}</span>`).join("");
  $("drawer").innerHTML = `<button class="close" onclick="closeDrawer()">close</button>
    <h3>${esc(id)}</h3>
    <dl>
      <dt>state</dt><dd class="st ${state}">${state}</dd>
      <dt>kind</dt><dd>${esc(s.kind || "job")}</dd>
      <dt>submitted</dt><dd>${esc(s.submitted_by)}</dd>
      <dt>claimed by</dt><dd>${c ? esc(names[c.node] || c.node) : "–"}</dd>
      <dt>reason</dt><dd>${esc(s.node ? "pinned to " + (names[s.node] || s.node) : s.pick || (Object.keys(s.selector || {}).length ? "selector " + Object.entries(s.selector).map(([k,v]) => k + "=" + v).join(",") : "any eligible node"))}</dd>
      <dt>session</dt><dd>${esc(s.tmux || "–")}</dd>
      ${s.batch ? `<dt>batch</dt><dd>${esc(s.batch)}</dd>` : ""}
      ${s.after && s.after.length ? `<dt>after</dt><dd>${s.after.map(a => esc(a.slice(0,8))).join(", ")}</dd>` : ""}
      ${s.retries ? `<dt>retries</dt><dd>${s.retry} of ${s.retries} used</dd>` : ""}
      ${s.cancel_reason ? `<dt>cancelled</dt><dd>${esc(s.cancel_reason)}</dd>` : ""}
      <dt>created</dt><dd>${hms(s.submitted_at_ms)}</dd>
      <dt>claimed</dt><dd>${c ? hms(c.claimed_at_ms) : "–"}</dd>
      <dt>started</dt><dd>${c && c.started_at_ms ? hms(c.started_at_ms) : "–"}</dd>
      <dt>finished</dt><dd>${r ? hms(r.finished_at_ms) : "–"}</dd>
      <dt>command</dt><dd class="cmd">${esc(s.cmd.join(" "))}</dd>
    </dl>
    <h4>stdout</h4><pre>${esc(out) || "<span class=sub>(no output yet)</span>"}</pre>
    <h4>timeline</h4><div class="rec">${timeline.map(([n, t, d]) => `<span>${n}</span><span>${t ? hms(t) : ""} ${esc(d)}</span>`).join("")}</div>
    <h4>records</h4><div class="rec">${recs}</div>`;
  $("drawer").hidden = false;
}
async function cancel(id) {
  const rec = await j("/v1/records/job/" + id);
  rec.value.cancelled = true;
  await fetch("/v1/records/job/" + id, { method: "PUT", headers: {"content-type": "application/json"}, body: JSON.stringify({ value: rec.value }) });
  render();
}
let timer = null;
function schedule() { clearTimeout(timer); timer = setTimeout(() => render().catch(e => { $("live").textContent = e.message; }), 300); }
function listen() {
  const es = new EventSource("/v1/events");
  es.addEventListener("record", schedule);
  es.onopen = () => { $("live").textContent = "live"; };
  es.onerror = () => { $("live").textContent = "reconnecting…"; };
}
render().catch(e => { $("live").textContent = e.message; });
listen();
setInterval(schedule, 15000);
</script>
</body>
</html>
