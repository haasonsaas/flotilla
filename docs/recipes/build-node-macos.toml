# Desired state for a macOS build node: cargo toolchain, sccache wired into
# cargo, and a launchd agent that clears stale build directories.
#
#   flotilla desired set <node> -f docs/recipes/build-node-macos.toml
#
# Same layout and cleanup rule as build-node.toml: ~/builds/<name>/ with no
# file written in 7 days is removed every 6 hours. Set BUILD_ROOT or
# BUILD_MAX_AGE_DAYS under EnvironmentVariables in the plist below.

[[files]]
path = "~/.local/bin/flotilla-build-clean"
mode = "0755"
content = '''
#!/bin/sh
# Remove build directories under $BUILD_ROOT that have had no file written in
# the last $BUILD_MAX_AGE_DAYS days. Only direct children are candidates.
set -eu
root="${BUILD_ROOT:-$HOME/builds}"
days="${BUILD_MAX_AGE_DAYS:-7}"
case "$root" in
  ""|/|"$HOME"|"$HOME"/) echo "refusing BUILD_ROOT=$root" >&2; exit 2 ;;
  /*) ;;
  *) echo "BUILD_ROOT must be absolute" >&2; exit 2 ;;
esac
case "$days" in ""|*[!0-9]*) echo "bad BUILD_MAX_AGE_DAYS" >&2; exit 2 ;; esac
[ -d "$root" ] || exit 0
for d in "$root"/*/; do
  [ -d "$d" ] || continue
  if [ -z "$(find "$d" -type f -mtime -"$days" 2>/dev/null | head -n 1)" ]; then
    rm -rf "$d"
  fi
done
'''

[[files]]
path = "~/Library/LaunchAgents/dev.flotilla.build-clean.plist"
content = '''
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Label</key><string>dev.flotilla.build-clean</string>
  <key>ProgramArguments</key>
  <array><string>/bin/sh</string><string>-c</string><string>exec "$HOME/.local/bin/flotilla-build-clean"</string></array>
  <key>EnvironmentVariables</key>
  <dict><key>BUILD_MAX_AGE_DAYS</key><string>7</string></dict>
  <key>StartInterval</key><integer>21600</integer>
  <key>RunAtLoad</key><true/>
</dict>
</plist>
'''

[[ensure]]
name = "build-clean-agent"
check = ["sh", "-c", "launchctl print \"gui/$(id -u)/dev.flotilla.build-clean\" >/dev/null 2>&1"]
apply = ["sh", "-c", "launchctl bootstrap \"gui/$(id -u)\" \"$HOME/Library/LaunchAgents/dev.flotilla.build-clean.plist\""]

[[ensure]]
name = "rust-toolchain"
check = ["sh", "-c", "test -x \"$HOME/.cargo/bin/cargo\""]
apply = ["sh", "-c", "curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path"]

[[ensure]]
name = "sccache"
check = ["sh", "-c", "test -x \"$HOME/.cargo/bin/sccache\""]
apply = ["sh", "-c", "PATH=\"$HOME/.cargo/bin:$PATH\" cargo install sccache --locked"]

# Appends a [build]/[env] block to ~/.cargo/config.toml, and only when the
# file has no [build] table of its own (a second one would be invalid TOML).
# In that case it fails and shows in `flotilla desired status`; merge by hand.
[[ensure]]
name = "cargo-sccache-wrapper"
check = ["sh", "-c", "grep -qs '^rustc-wrapper *= *\"sccache\"' \"$HOME/.cargo/config.toml\""]
apply = ["sh", "-c", "test -x \"$HOME/.cargo/bin/sccache\" && ! grep -qs '^\\[build\\]' \"$HOME/.cargo/config.toml\" && mkdir -p \"$HOME/.cargo\" && printf '[build]\\nrustc-wrapper = \"sccache\"\\n\\n[env]\\nSCCACHE_CACHE_SIZE = \"50G\"\\n' >> \"$HOME/.cargo/config.toml\""]
