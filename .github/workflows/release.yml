name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS is cross-compiled on the Apple Silicon runner; the
          # macos-13 Intel runners are retired and queue forever.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: package
        run: |
          set -eu
          out=flotilla-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$out"
          cp target/${{ matrix.target }}/release/flotilla target/${{ matrix.target }}/release/flotillad "$out"/
          cp README.md LICENSE "$out"/
          tar czf "$out.tar.gz" "$out"
          shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            flotilla-*.tar.gz
            flotilla-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
